name: verify

on:
  push:
    branches: [main, work]
  pull_request:
    branches: [main, work]

permissions:
  contents: read

jobs:
  repository:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify repository
        run: python tools/verify_repo.py
      - name: Verify required target-client binary
        run: python tools/verify_reference_client.py
      - name: Verify active runtime
        run: python tools/verify_current.py
      - name: Install pinned PE audit dependency
        run: python -m pip install pefile==2024.8.26
      - name: Audit exact reference-client PE
        run: python tools/audit_reference_client.py --output dist/reference-client-pe-audit.json --check-recorded
      - name: Upload PE audit report
        uses: actions/upload-artifact@v4
        with:
          name: reference-client-pe-audit
          path: dist/reference-client-pe-audit.json
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Rebuild deterministic runtime package
        run: python tools/make_runtime_package.py --output dist/frostmourne-runtime.zip
      - uses: actions/upload-artifact@v4
        with:
          name: runtime-manifest-package
          path: dist/frostmourne-runtime.zip

  windows-x86-toolchain:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify manifests and required target-client binary on Windows
        run: |
          python tools/verify_repo.py
          python tools/verify_reference_client.py
          python tools/verify_current.py
      - name: Compile CI-only x86 smoke PE
        shell: cmd
        run: |
          for /f "usebackq tokens=*" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do set VSINSTALL=%%i
          if not defined VSINSTALL exit /b 1
          call "%VSINSTALL%\Common7\Tools\VsDevCmd.bat" -arch=x86 -host_arch=x64
          if errorlevel 1 exit /b 1
          cl /nologo /W4 /WX /Fe:tests\x86_smoke.exe tests\x86_smoke.c
          tests\x86_smoke.exe
      - name: Check PE machine is x86
        shell: python
        run: |
          import struct
          p='tests/x86_smoke.exe'
          with open(p,'rb') as f:
              assert f.read(2)==b'MZ'
              f.seek(0x3c); off=struct.unpack('<I',f.read(4))[0]
              f.seek(off); assert f.read(4)==b'PE\0\0'
              machine=struct.unpack('<H',f.read(2))[0]
          assert machine==0x014c, hex(machine)
          print('x86 PE smoke: PASS')


  updater-windows-x86:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x86
      - name: Verify 32-bit Python and updater unit tests
        shell: pwsh
        run: |
          python -c "import struct; assert struct.calcsize('P') == 4, 'Expected x86 Python'"
          python -m unittest discover -s tests -v
          python tools/verify_repo.py
          python tools/verify_current.py
          python tools/verify_reference_client.py
      - name: Build Windows x86 standalone GUI executable
        shell: pwsh
        run: |
          python -m pip install pyinstaller==6.16.0
          python -m PyInstaller --noconfirm --clean --onefile --windowed --name FrostmourneUpdater --paths . src/updater/launcher.py
      - name: Verify updater PE architecture and package installable ZIP
        shell: pwsh
        run: |
          python -c "import pathlib,struct; p=pathlib.Path('dist/FrostmourneUpdater.exe'); b=p.read_bytes(); assert b[:2]==b'MZ'; o=struct.unpack_from('<I',b,0x3c)[0]; assert b[o:o+4]==b'PE\x00\x00'; m=struct.unpack_from('<H',b,o+4)[0]; assert m==0x14c, hex(m); print('UPDATER WINDOWS X86: PASS',len(b),'bytes')"
          Copy-Item docs/UPDATER.md dist/README-UPDATER.md
          Compress-Archive -Path dist/FrostmourneUpdater.exe,dist/README-UPDATER.md -DestinationPath dist/frostmourne-updater-win-x86.zip -Force
          Get-FileHash dist/FrostmourneUpdater.exe -Algorithm SHA256
      - uses: actions/upload-artifact@v4
        with:
          name: frostmourne-updater-win-x86
          path: dist/frostmourne-updater-win-x86.zip
          if-no-files-found: error
