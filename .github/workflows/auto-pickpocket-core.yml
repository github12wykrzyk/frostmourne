name: auto-pickpocket-core

on:
  push:
    branches: [work]
    paths:
      - 'src/auto_pickpocket/**'
      - 'tests/test_auto_pickpocket.c'
      - 'docs/AUTO_PICKPOCKET.md'
      - '.github/workflows/auto-pickpocket-core.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  core-linux-sanitizers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile and run isolated logic tests (ASan/UBSan)
        run: |
          gcc -std=c11 -Wall -Wextra -Werror -pedantic -fsanitize=address,undefined -fno-omit-frame-pointer -g src/auto_pickpocket/auto_pickpocket.c tests/test_auto_pickpocket.c -o /tmp/test-auto-pickpocket
          ASAN_OPTIONS=detect_leaks=1 /tmp/test-auto-pickpocket
  core-windows-x86:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify project and pinned client before compilation
        shell: cmd
        run: |
          python tools/verify_reference_client.py
          if errorlevel 1 exit /b 1
          python tools/verify_current.py
          if errorlevel 1 exit /b 1
          python tools/verify_repo.py
          if errorlevel 1 exit /b 1
      - name: Build and run stand-alone x86 unit test (no game)
        shell: cmd
        run: |
          for /f "tokens=*" %%i in ('"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath') do set VSINSTALL=%%i
          if not defined VSINSTALL exit /b 1
          call "%VSINSTALL%\Common7\Tools\VsDevCmd.bat" -arch=x86 -host_arch=x64
          if errorlevel 1 exit /b 1
          cl /nologo /W4 /WX /std:c11 /Fe:ap-test-x86.exe src\auto_pickpocket\auto_pickpocket.c tests\test_auto_pickpocket.c
          if errorlevel 1 exit /b 1
          ap-test-x86.exe
          if errorlevel 1 exit /b 1
