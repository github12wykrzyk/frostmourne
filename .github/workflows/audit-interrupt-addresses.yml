name: audit-interrupt-addresses
on:
  push:
    branches: [work]
    paths:
      - 'tools/audit_interrupt_addresses.py'
      - '.github/workflows/audit-interrupt-addresses.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect-reference-wow-x86:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify registered client before examining any addresses
        shell: cmd
        run: |
          python tools/verify_reference_client.py --path reference/client/Wow.exe
          if errorlevel 1 exit /b 1
          python tools/verify_current.py
          if errorlevel 1 exit /b 1
          python tools/verify_repo.py
          if errorlevel 1 exit /b 1
      - name: Install pinned read-only disassembler
        shell: cmd
        run: |
          python -m pip install pefile==2024.8.26 capstone==5.0.6
          if errorlevel 1 exit /b 1
      - name: Inspect exact client candidate addresses and instruction windows
        shell: cmd
        run: |
          python tools/audit_interrupt_addresses.py
          if errorlevel 1 exit /b 1
