name: audit-auto-pickpocket-adapter
on:
  push:
    branches: [work]
    paths:
      - 'tools/audit_auto_pickpocket_adapter.py'
      - '.github/workflows/audit-auto-pickpocket-adapter.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  exact-12340-static-audit:
    runs-on: windows-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify exact reference client and current baseline
        shell: cmd
        run: |
          python tools/verify_reference_client.py --path reference/client/Wow.exe
          if errorlevel 1 exit /b 1
          python tools/verify_current.py
          if errorlevel 1 exit /b 1
          python tools/verify_repo.py
          if errorlevel 1 exit /b 1
      - name: Install pinned static analysis dependencies
        shell: cmd
        run: |
          python -m pip install pefile==2024.8.26 capstone==5.0.6
          if errorlevel 1 exit /b 1
      - name: Audit Pick Pocket spell targeting registration in exact reference
        shell: cmd
        run: |
          python tools/audit_auto_pickpocket_adapter.py
          if errorlevel 1 exit /b 1
      - name: Publish static audit report (not a playable DLL)
        uses: actions/upload-artifact@v4
        with:
          name: frostmourne-auto-pickpocket-static-audit
          path: dist/auto-pickpocket-static-audit.json
          if-no-files-found: error
