name: wow-process-readonly-x86

on:
  push:
    branches: [work]
    paths:
      - 'src/bootstrap/process_check.c'
      - 'tools/package_process_check.py'
      - 'docs/PROCESS_CHECK.md'
      - '.github/workflows/wow-process-readonly.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  readonly-windows-x86:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify exact reference client and unchanged active runtime
        shell: cmd
        run: |
          python tools/verify_reference_client.py
          if errorlevel 1 exit /b 1
          python tools/verify_current.py
          if errorlevel 1 exit /b 1
          python tools/verify_repo.py
          if errorlevel 1 exit /b 1
      - name: Compile read-only Windows x86 process GUI
        shell: cmd
        run: |
          for /f "usebackq tokens=*" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do set VSINSTALL=%%i
          if not defined VSINSTALL exit /b 1
          call "%VSINSTALL%\Common7\Tools\VsDevCmd.bat" -arch=x86 -host_arch=x64
          if errorlevel 1 exit /b 1
          if not exist dist mkdir dist
          cl /nologo /W4 /WX /MT /DUNICODE /D_UNICODE /Fe:dist\FrostmourneProcessCheck.exe src\bootstrap\process_check.c /link /SUBSYSTEM:WINDOWS /INCREMENTAL:NO
          if errorlevel 1 exit /b 1
      - name: Exercise no-game branch without showing a dialog
        shell: cmd
        run: |
          dist\FrostmourneProcessCheck.exe
          if errorlevel 1 exit /b 1
      - name: Audit Windows x86 binary and package with SHA256 manifest
        shell: cmd
        run: |
          python -m pip install pefile==2024.8.26
          if errorlevel 1 exit /b 1
          python tools/package_process_check.py
          if errorlevel 1 exit /b 1
      - name: Upload process diagnostic ZIP (no client executable or injected DLL)
        uses: actions/upload-artifact@v4
        with:
          name: frostmourne-wow-process-readonly-x86
          path: dist/frostmourne-process-check-x86.zip
          if-no-files-found: error
