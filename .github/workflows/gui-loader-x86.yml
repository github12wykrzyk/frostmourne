name: gui-loader-x86

on:
  push:
    branches: [work]
    paths:
      - 'src/loader/**'
      - 'tools/package_universal_loader.py'
      - 'docs/UNIVERSAL_LOADER.md'
      - 'tools/package_gui_loader.py'
      - 'docs/GUI_LOADER_TEST.md'
      - '.github/workflows/gui-loader-x86.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  gui-launcher-windows-x86:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify audited 12340 reference, active runtime and repository
        shell: cmd
        run: |
          python tools/verify_reference_client.py
          if errorlevel 1 exit /b 1
          python tools/verify_current.py
          if errorlevel 1 exit /b 1
          python tools/verify_repo.py
          if errorlevel 1 exit /b 1
      - name: Compile both Lua addon variants before building the native DLL
        shell: cmd
        run: |
          python -m pip install lupa==2.6
          if errorlevel 1 exit /b 1
          python tools/verify_cast_probe_lua.py
          if errorlevel 1 exit /b 1
      - name: Compile test and debug bootstrap DLLs for x86
        shell: cmd
        run: |
          for /f "tokens=*" %%i in ('"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath') do set VSINSTALL=%%i
          if not defined VSINSTALL exit /b 1
          call "%VSINSTALL%\Common7\Tools\VsDevCmd.bat" -arch=x86 -host_arch=x64
          if errorlevel 1 exit /b 1
          if not exist dist mkdir dist
          cl /nologo /W4 /WX /MT /LD /Fe:dist\FrostmourneBootstrap.dll src\bootstrap\bootstrap.c src\auto_pickpocket\auto_pickpocket.c src\auto_pickpocket\native_adapter.c src\auto_interrupt\kick_native_bridge.c /link /INCREMENTAL:NO user32.lib
          if errorlevel 1 exit /b 1
          cl /nologo /W4 /WX /MT /Od /Zi /DFM_DEBUG_BUILD /LD /Fe:dist\FrostmourneBootstrapDebug.dll src\bootstrap\bootstrap.c src\auto_pickpocket\auto_pickpocket.c src\auto_pickpocket\native_adapter.c src\auto_interrupt\kick_native_bridge.c /link /DEBUG /PDB:dist\FrostmourneBootstrapDebug.pdb /INCREMENTAL:NO user32.lib
          if errorlevel 1 exit /b 1
      - name: Compile WinForms GUI x86 release and debug
        shell: cmd
        run: |
          "%WINDIR%\Microsoft.NET\Framework\v4.0.30319\csc.exe" /nologo /target:winexe /platform:x86 /optimize+ /out:dist\FrostmourneGui.exe /reference:System.dll /reference:System.Drawing.dll /reference:System.Windows.Forms.dll /reference:System.Web.Extensions.dll /reference:System.IO.Compression.dll src\loader\Program.cs src\loader\RemoteBootstrap.cs src\loader\ModuleCatalog.cs src\loader\ModuleOptionsDialog.cs src\loader\UpdateClient.cs
          if errorlevel 1 exit /b 1
          "%WINDIR%\Microsoft.NET\Framework\v4.0.30319\csc.exe" /nologo /target:winexe /platform:x86 /debug:full /define:DEBUG /out:dist\FrostmourneGuiDebug.exe /pdb:dist\FrostmourneGuiDebug.pdb /reference:System.dll /reference:System.Drawing.dll /reference:System.Windows.Forms.dll /reference:System.Web.Extensions.dll /reference:System.IO.Compression.dll src\loader\Program.cs src\loader\RemoteBootstrap.cs src\loader\ModuleCatalog.cs src\loader\ModuleOptionsDialog.cs src\loader\UpdateClient.cs
          if errorlevel 1 exit /b 1
      - name: Audit PE32, ABI, dependencies and immutable ZIP contents
        shell: cmd
        run: |
          python -m pip install pefile==2024.8.26
          if errorlevel 1 exit /b 1
          python tools/package_gui_loader.py
          if errorlevel 1 exit /b 1
          python tools/package_universal_loader.py
          if errorlevel 1 exit /b 1
      - name: Run no-game packaged DLL self-tests
        shell: cmd
        run: |
          dist\FrostmourneGui.exe --self-test
          if errorlevel 1 exit /b 1
          dist\FrostmourneGuiDebug.exe --self-test
          if errorlevel 1 exit /b 1
      - name: Test manifest, invalid ABI and unsafe ZIP path rejection
        shell: cmd
        run: |
          dist\FrostmourneGui.exe --updater-self-test
          if errorlevel 1 exit /b 1
      - name: Verify public GitHub feed download, installation and invalid-SHA rollback
        shell: cmd
        run: |
          dist\FrostmourneGui.exe --updater-integration-test
          if errorlevel 1 exit /b 1
      - name: Prepare standalone DLL with alternative descriptive name
        shell: cmd
        run: |
          copy /Y dist\FrostmourneBootstrap.dll dist\FrostmourneModules.dll
          if errorlevel 1 exit /b 1
      - name: Upload standalone Frostmourne x86 DLL for existing loader
        uses: actions/upload-artifact@v4
        with:
          name: frostmourne-modules-x86-dll-only
          path: dist/FrostmourneModules.dll
          if-no-files-found: error
      - name: Upload independent GUI loader with test/debug DLLs
        uses: actions/upload-artifact@v4
        with:
          name: frostmourne-gui-loader-x86
          path: dist/frostmourne-gui-loader-x86.zip
          if-no-files-found: error

      - name: Upload universal x86 loader (separate archive)
        uses: actions/upload-artifact@v4
        with:
          name: Frostmourne_Universal_Loader_x86
          path: dist/Frostmourne_Universal_Loader_x86.zip
          if-no-files-found: error
      - name: Upload independently replaceable x86 module bundle
        uses: actions/upload-artifact@v4
        with:
          name: Frostmourne_Modules_x86
          path: dist/Frostmourne_Modules_x86.zip
          if-no-files-found: error

      - name: Publish complete first-test loader ZIP as commit-pinned prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $tag = "work-loader-${{ github.sha }}"
          gh release create $tag dist/frostmourne-gui-loader-x86.zip --target "${{ github.sha }}" --title "Frostmourne universal loader ${{ github.sha }}" --notes "Experimental Windows x86 loader + bootstrap DLL + Lua addon. Gameplay unverified." --prerelease
