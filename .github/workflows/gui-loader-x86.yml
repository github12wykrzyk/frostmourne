name: gui-loader-x86

on:
  push:
    branches: [work]
    paths:
      - 'src/loader/**'
      - 'src/bootstrap/bootstrap.c'
      - 'src/bootstrap/bootstrap.h'
      - 'tools/package_gui_loader.py'
      - 'docs/GUI_LOADER_TEST.md'
      - '.github/workflows/gui-loader-x86.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gui-launcher-windows-x86:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify audited 12340 reference, active runtime and repository
        shell: cmd
        run: |
          python tools/verify_reference_client.py
          if errorlevel 1 exit /b 1
          python tools/verify_current.py
          if errorlevel 1 exit /b 1
          python tools/verify_repo.py
          if errorlevel 1 exit /b 1
      - name: Compile original diagnostic bootstrap DLL for x86
        shell: cmd
        run: |
          for /f "tokens=*" %%i in ('"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath') do set VSINSTALL=%%i
          if not defined VSINSTALL exit /b 1
          call "%VSINSTALL%\Common7\Tools\VsDevCmd.bat" -arch=x86 -host_arch=x64
          if errorlevel 1 exit /b 1
          if not exist dist mkdir dist
          cl /nologo /W4 /WX /MT /LD /Fe:dist\FrostmourneBootstrap.dll src\bootstrap\bootstrap.c /link /INCREMENTAL:NO
          if errorlevel 1 exit /b 1
      - name: Compile standalone WinForms .NET Framework GUI for x86
        shell: cmd
        run: |
          "%WINDIR%\Microsoft.NET\Framework\v4.0.30319\csc.exe" /nologo /target:winexe /platform:x86 /optimize+ /out:dist\FrostmourneGui.exe /reference:System.dll /reference:System.Drawing.dll /reference:System.Windows.Forms.dll src\loader\Program.cs
          if errorlevel 1 exit /b 1
      - name: Audit PE32, ABI, dependencies and immutable ZIP contents
        shell: cmd
        run: |
          python -m pip install pefile==2024.8.26
          if errorlevel 1 exit /b 1
          python tools/package_gui_loader.py
          if errorlevel 1 exit /b 1
      - name: Run no-game packaged DLL self-test (never starts Wow.exe)
        shell: cmd
        run: |
          dist\FrostmourneGui.exe --self-test
          if errorlevel 1 exit /b 1
      - name: Upload independent GUI loader and bundled test DLL
        uses: actions/upload-artifact@v4
        with:
          name: frostmourne-gui-loader-x86
          path: dist/frostmourne-gui-loader-x86.zip
          if-no-files-found: error
